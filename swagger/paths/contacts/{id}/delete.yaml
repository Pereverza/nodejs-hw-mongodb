tags:
  - Contacts
summary: Delete contact by id
operationId: deleteContact
description: Delete contact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: id of the contact
    schema:
      type: string
      example: '6873931693de78b89865c08f'
responses:
  '200':
    description: Contact delete successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact deleted successfully!
  '401':
          $ref: ../../../components/responses/401.yaml
  '404':
          $ref: '../../../components/responses/404.yaml'

