tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create a new contact with payload
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Jane Doe'
          email:
            description: "Contact's email"
            type: string
            example: 'jane@example.com'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380931234567'
          contactType:
            description: "Type of contact"
            type: string
            enum: ['home', 'work', 'personal']
            example: 'home'
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
  